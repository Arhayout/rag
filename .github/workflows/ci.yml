name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  project1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project1_hackerrank_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project1_hackerrank_rag/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q

  project2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project2_ldsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project2_ldsa/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --ignore-missing-imports --check-untyped-defs src app.py main.py scripts
      - run: pytest -q
